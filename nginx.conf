# Nginx configuration for basketball-scene-proxy
# Place this file in /etc/nginx/sites-available/ and create symlink in /etc/nginx/sites-enabled/

upstream basketball_proxy {
    # Load balancing between multiple instances
    server 127.0.0.1:3000;
    # Add more servers if running multiple instances
    # server 127.0.0.1:3001;
    # server 127.0.0.1:3002;
    
    # Health check
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your domain
    
    # Custom error pages
    error_page 403 /3d/external/view/403.html;
    error_page 404 /3d/external/view/403.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Client settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Proxy settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    
    # Proxy non-static requests to Node.js application
    location @proxy {
        proxy_pass http://basketball_proxy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Main location for /3d/external/view/ path
    location /3d/external/view/ {
        try_files $uri @proxy;
        
        alias /path/to/your/project/;
        
        # Cache static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|html|json|xml|txt|glb|gltf|manifest)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Security: prevent access to sensitive files
        location ~ /3d/external/view/.*\.(env|log|sh|conf)$ {
            deny all;
        }
    }
    
    # Handle root path - redirect to the correct path or show info
    location = / {
        return 301 /3d/external/view/;
    }
    
    
    # Handle other paths - return 404
    location / {
        return 404;
    }
    
    # Example: Proxy other API endpoints
    # location /api/ {
    #     proxy_pass http://other-backend;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://basketball_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static files (if you have any)
    location /static/ {
        alias /path/to/your/static/files/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Logging
    access_log /var/log/nginx/basketball_proxy_access.log;
    error_log /var/log/nginx/basketball_proxy_error.log;
}

