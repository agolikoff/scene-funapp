<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .error-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: bold;
            margin: 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .error-message {
            font-size: 24px;
            margin: 20px 0;
            font-weight: 300;
            line-height: 1.4;
        }
        
        .error-description {
            font-size: 16px;
            margin: 20px 0 40px 0;
            opacity: 0.8;
            line-height: 1.5;
        }
        
        .retry-button {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        
        .basketball-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .error-container {
                padding: 40px 20px;
                margin: 20px;
            }
            
            .error-code {
                font-size: 80px;
            }
            
            .error-message {
                font-size: 20px;
            }
            
            .error-description {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="basketball-icon">🏀</div>
        <h1 class="error-code">403</h1>
        <h2 class="error-message" id="error-message">Invalid Credentials</h2>
        <p class="error-description" id="error-description">
            Please try again
        </p>
        <a href="javascript:location.reload()" class="retry-button">Reload the page</a>
    </div>

    <script type="module">
        // Load custom error message from config if available
        async function loadCustomErrorMessage() {
            try {
                const { ERROR_403_CONFIG } = await import('./js/config/errors.js');
                document.getElementById('error-message').textContent = ERROR_403_CONFIG.message;
                document.getElementById('error-description').textContent = ERROR_403_CONFIG.description;
            } catch (error) {
                console.log('Could not load error config, using fallback text');
            }
        }
        
        // Load custom message on page load
        document.addEventListener('DOMContentLoaded', loadCustomErrorMessage);
    </script>
</body>
</html>
